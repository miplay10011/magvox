<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Voxel Game</title>
  <style>
    body { margin: 0; overflow: hidden; touch-action: none; }
    #hud {
      position: absolute; top: 10px; left: 10px;
      color: white; font-family: monospace; font-size: 13px;
      background: rgba(0,0,0,0.5); padding: 8px;
      user-select: none; pointer-events: none;
      z-index: 10;
    }
    #status {
      position: absolute; top: 10px; right: 10px;
      color: white; font-family: monospace; font-size: 14px;
      background: rgba(0,0,0,0.5); padding: 8px; pointer-events: none;
      z-index: 10;
    }
    #crosshair {
      position: absolute; top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      color: white; font-size: 22px; font-family: monospace;
      text-shadow: 0 0 3px black; pointer-events: none;
      z-index: 10;
    }
    #hotbar {
      position: absolute; bottom: 12px; left: 50%;
      transform: translateX(-50%);
      display: flex; gap: 4px; pointer-events: auto;
      z-index: 10;
    }
    .slot {
      width: 48px; height: 48px; position: relative;
      background: rgba(0,0,0,0.45); border: 2px solid #777;
      pointer-events: auto;
    }
    .slot.selected { border-color: #fff; }
    .slot .swatch { position: absolute; inset: 9px; border-radius: 2px; }
    .slot .count {
      position: absolute; bottom: 1px; right: 4px;
      color: white; font: bold 14px monospace; text-shadow: 1px 1px 0 black;
    }
    #inventory {
      position: absolute; inset: 0; background: rgba(0,0,0,0.5);
      display: none; align-items: center; justify-content: center;
      z-index: 100;
    }
    #inventory.open { display: flex; }
    #inv-panel { 
      background: #c6c6c6; padding: 14px; border: 3px solid #555; border-radius: 4px;
      max-width: 95vw; max-height: 90vh; overflow: auto;
    }
    #inv-panel .inv-grid { display: grid; grid-template-columns: repeat(9, 1fr); gap: 4px; margin-bottom: 8px; }
    #inv-panel .slot { pointer-events: auto; cursor: pointer; background: #8b8b8b; width: 100%; aspect-ratio: 1; }
    #inv-panel .slot:hover { background: #a8a8a8; }
    .recycle-slot {
      background: #2a6f8f !important;
      border: 2px solid #00aaff !important;
    }
    .recycle-button {
      width: 48px; height: 48px;
      background: #444; border: 2px solid #ddd;
      border-radius: 8px;
      display: flex; align-items: center; justify-content: center;
      font-size: 28px;
      cursor: pointer;
      transition: 0.1s;
    }
    .recycle-button:hover { background: #666; transform: scale(1.02); }
    #inv-craft-row {
      display: flex; gap: 16px; align-items: center; justify-content: center;
      margin-bottom: 16px;
    }
    #held-item {
      position: fixed; width: 36px; height: 36px;
      pointer-events: none; display: none; z-index: 10; border-radius: 2px;
    }
    #held-item .count {
      position: absolute; bottom: -2px; right: 2px;
      color: white; font: bold 14px monospace; text-shadow: 1px 1px 0 black;
    }
    #stats {
      position: absolute; bottom: 68px; left: 50%;
      transform: translateX(-50%); width: 464px; pointer-events: none;
      z-index: 10;
    }
    #hearts { font: 18px monospace; text-shadow: 1px 1px 0 black; letter-spacing: 2px; }
    #mana-bar {
      margin-top: 3px; height: 8px; background: rgba(0,0,0,0.5);
      border: 1px solid #224; border-radius: 3px;
    }
    #mana-fill { height: 100%; background: #38f; border-radius: 2px; transition: width 0.2s; }
    #damage-flash {
      position: absolute; inset: 0; background: rgba(255,0,0,0.35);
      opacity: 0; pointer-events: none; transition: opacity 0.4s;
      z-index: 90;
    }
    #magic-ring {
      position: absolute; top: 50%; left: 50%; width: 0; height: 0;
      display: none; pointer-events: none;
      z-index: 10;
    }
    #magic-ring.combat { display: block; }
    .element-icon {
      position: absolute; width: 34px; height: 34px; margin: -17px;
      border-radius: 50%; display: flex; align-items: center; justify-content: center;
      font-size: 17px; opacity: 0.25; border: 2px solid rgba(255,255,255,0.4);
      transition: opacity 0.15s, transform 0.15s; text-shadow: 0 0 3px black;
    }
    .element-icon .num {
      position: absolute; bottom: -15px; font: 10px monospace; color: #fff;
    }
    .element-icon.flash { opacity: 1; transform: scale(1.25); }
    #spell-queue {
      position: absolute; top: calc(50% + 95px); left: 50%; transform: translateX(-50%);
      display: flex; gap: 6px; pointer-events: none;
      z-index: 10;
    }
    .queued {
      width: 26px; height: 26px; border-radius: 50%; font-size: 14px;
      display: flex; align-items: center; justify-content: center; border: 2px solid #fff;
    }
    #effects-hud {
      position: absolute; left: 10px; top: 45%; color: #fff;
      font: 13px monospace; text-shadow: 1px 1px 0 #000; pointer-events: none;
      z-index: 10;
    }
    #coord-display {
      position: absolute; bottom: 10px; left: 10px;
      color: white; background: rgba(0,0,0,0.5); padding: 5px;
      font-family: monospace; z-index: 100;
    }
    #chat-container {
      position: absolute; bottom: 10px; right: 10px; width: 300px;
      background: rgba(0,0,0,0.7); color: white; font-family: sans-serif; z-index: 100;
    }
    #chat-messages {
      height: 200px; overflow-y: auto; padding: 5px; font-size: 14px;
    }
    #chat-input {
      width: 100%; padding: 5px; box-sizing: border-box;
      background: rgba(255,255,255,0.2); color: white; border: none; outline: none;
    }
    
    /* Мобильные элементы */
    #mobile-controls {
      display: none;
      position: absolute; inset: 0;
      pointer-events: none;
      z-index: 200;
    }
    .mobile-btn {
      pointer-events: auto;
      position: absolute;
      background: rgba(255,255,255,0.15);
      border: 2px solid rgba(255,255,255,0.5);
      border-radius: 12px;
      color: white;
      font-size: 24px;
      display: flex;
      align-items: center;
      justify-content: center;
      user-select: none;
      touch-action: manipulation;
      min-width: 44px;
      min-height: 44px;
      backdrop-filter: blur(4px);
      text-shadow: 0 0 4px black;
    }
    /* Джойстик в левом нижнем углу */
    #joy-area {
      position: absolute;
      bottom: 12%; left: 8%;
      width: 25vw; height: 25vw;
      max-width: 120px; max-height: 120px;
      background: rgba(255,255,255,0.1);
      border-radius: 50%;
      pointer-events: auto;
      touch-action: none;
    }
    #joy-stick {
      position: absolute;
      width: 50%; height: 50%;
      background: rgba(255,255,255,0.4);
      border-radius: 50%;
      left: 25%; top: 25%;
      transition: left 0.05s, top 0.05s;
    }
    /* Правый нижний блок кнопок (прыжок, полёт, спуск, атака) */
    #btn-jump { bottom: 12%; right: 20%; }
    #btn-fly { bottom: 18%; right: 20%; }
    #btn-descend { bottom: 18%; right: 8%; }
    #btn-attack { bottom: 24%; right: 20%; }
    /* Правый верхний блок (инвентарь, книга, чат, настройки) */
    #btn-inventory { top: 12%; right: 8%; }
    #btn-book { top: 20%; right: 8%; }
    #btn-chat { top: 28%; right: 8%; }
    #btn-settings { top: 36%; right: 8%; } /* новая */
    /* Верхний левый угол (боевой режим) */
    #btn-combat { top: 12%; left: 8%; }
    /* Нижний центр (ломать/ставить) */
    #btn-break { bottom: 8%; left: 50%; transform: translateX(-50%); }
    #btn-place { bottom: 16%; left: 50%; transform: translateX(-50%); }

    /* Адаптация под мобильные */
    @media (max-width: 1024px), (pointer: coarse) {
      #mobile-controls { display: block; }
      #hud { font-size: 10px; top: 5px; left: 5px; }
      #status { font-size: 10px; top: 5px; right: 5px; }
      .slot { width: 36px; height: 36px; }
      #stats { bottom: 100px; width: 340px; }
      #hearts { font-size: 14px; }
      #mana-bar { height: 6px; }
      #crosshair { font-size: 18px; }
      #chat-container { width: 200px; }
      #chat-messages { height: 120px; }
      #magic-ring.combat { pointer-events: auto; }
      .element-icon { pointer-events: auto; }
      /* адаптация книги и инвентаря */
      .spell-book {
        width: 90vw !important;
        max-height: 85vh !important;
        font-size: 12px;
      }
      #inv-panel {
        padding: 8px;
      }
      #inv-panel .inv-grid {
        grid-template-columns: repeat(9, 1fr);
        gap: 2px;
      }
      #inv-panel .slot {
        width: 100%;
        aspect-ratio: 1;
        font-size: 12px;
      }
    }
  </style>
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.165.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.165.0/examples/jsm/"
      }
    }
  </script>
</head>
<body>
  <div id="hud">Клик — мышь · WASD · Space · E инвентарь · H - Книга · Q бой · бой: 1–9 элементы, ЛКМ/ПКМ каст · Tab настройки · T чат · /fly /kill</div>
  <div id="status">подключение…</div>
  <div id="crosshair">+</div>
  <div id="magic-ring"></div>
  <div id="spell-queue"></div>
  <div id="effects-hud"></div>
  <div id="stats">
    <div id="hearts"></div>
    <div id="mana-bar"><div id="mana-fill"></div></div>
  </div>
  <div id="hotbar"></div>
  <div id="inventory">
    <div id="inv-panel">
      <div id="inv-craft-row">
        <div id="recycle-slot" class="slot recycle-slot" data-index="36"></div>
        <div id="recycle-button" class="recycle-button" title="Переработать блок">♻️</div>
      </div>
      <div class="inv-grid" id="inv-main"></div>
      <div class="inv-grid" id="inv-hotbar-row"></div>
      <button id="close-inv-btn" style="margin-top:8px; width:100%; display:none; background:#444; color:white; border:none; padding:8px;">Закрыть инвентарь</button>
    </div>
  </div>
  <div id="held-item"><div class="count"></div></div>
  <div id="damage-flash"></div>
  <div id="coord-display"></div>
  <div id="chat-container">
    <div id="chat-messages"></div>
    <input type="text" id="chat-input" placeholder="Чат...">
  </div>

  <!-- Мобильное управление -->
  <div id="mobile-controls">
    <div id="joy-area">
      <div id="joy-stick"></div>
    </div>
    <div class="mobile-btn" id="btn-jump">🦘</div>
    <div class="mobile-btn" id="btn-fly">🕊️</div>
    <div class="mobile-btn" id="btn-attack">⚔️</div>
    <div class="mobile-btn" id="btn-descend">🔽</div>
    <div class="mobile-btn" id="btn-inventory">🎒</div>
    <div class="mobile-btn" id="btn-book">📖</div>
    <div class="mobile-btn" id="btn-chat">💬</div>
    <div class="mobile-btn" id="btn-settings">⚙️</div>
    <div class="mobile-btn" id="btn-combat">⚔️</div>
    <div class="mobile-btn" id="btn-break">⛏️</div>
    <div class="mobile-btn" id="btn-place">🧱</div>
  </div>

  <script type="module" src="main.js"></script>
</body>
</html>
